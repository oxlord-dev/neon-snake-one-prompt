<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake — built from one prompt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #050510;
    color: #e8fff6;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px;
  }
  h1 {
    font-size: 34px; letter-spacing: 4px; color: #39ff88;
    text-shadow: 0 0 12px #39ff88, 0 0 32px #00e5ff;
    margin-bottom: 6px; text-align: center;
  }
  .sub { color: #9df3ff; font-size: 14px; margin-bottom: 12px; text-align: center; }
  #hud {
    width: min(92vw, 480px); display: flex; justify-content: space-between;
    font-size: 20px; font-weight: 700; margin-bottom: 8px;
  }
  #hud span b { color: #ffe14d; }
  #hud .speed b { color: #ff5df2; }
  canvas {
    width: min(92vw, 480px); height: min(92vw, 480px);
    background: #0a0a24; border: 3px solid #39ff88; border-radius: 12px;
    box-shadow: 0 0 24px rgba(57,255,136,.45), 0 0 64px rgba(0,229,255,.25);
    display: block;
  }
  .keys { color: #8f8fb3; font-size: 13px; margin-top: 10px; text-align: center; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5,5,16,.82); z-index: 10; text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay .box h2 { font-size: 40px; color: #ff5d7a; text-shadow: 0 0 18px #ff5d7a; margin-bottom: 8px; }
  #overlay .box p { font-size: 20px; margin-bottom: 16px; }
  #overlay button {
    font-size: 20px; font-weight: 800; padding: 12px 28px; border: 0; border-radius: 999px;
    background: #39ff88; color: #04140a; cursor: pointer;
    box-shadow: 0 0 20px rgba(57,255,136,.7);
  }
</style>
</head>
<body>
  <h1>NEON SNAKE</h1>
  <div class="sub">Built from one prompt &middot; make.fun</div>
  <div id="hud"><span>SCORE <b id="score">0</b></span><span class="speed">SPEED <b id="speed">1x</b></span><span>BEST <b id="best">0</b></span></div>
  <canvas id="game" width="480" height="480"></canvas>
  <div class="keys">Arrow keys / WASD to move &middot; R to restart &middot; P to pause</div>
  <div id="overlay"><div class="box"><h2>GAME OVER</h2><p>Score: <b id="finalScore">0</b></p><button id="restartBtn">PLAY AGAIN</button></div></div>
<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var CELL = 24, COLS = 20, ROWS = 20;
  var scoreEl = document.getElementById('score');
  var speedEl = document.getElementById('speed');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var finalScoreEl = document.getElementById('finalScore');
  var params = new URLSearchParams(location.search);
  var AUTOPLAY = params.has('autoplay') || params.has('demo');
  var best = 0;
  try { best = parseInt(localStorage.getItem('neon-snake-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  var snake, dir, nextDir, food, score, speed, alive, paused, timer;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0}; nextDir = dir;
    score = 0; speed = 1; alive = true; paused = false;
    scoreEl.textContent = '0'; speedEl.textContent = '1.0x';
    overlay.classList.remove('show');
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, 150);
  }
  function placeFood() {
    while (true) {
      var f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!onSnake) { food = f; return; }
    }
  }
  function stepMs() { return Math.max(60, Math.round(150 / speed)); }
  function tick() {
    if (!alive || paused) return;
    if (AUTOPLAY) autoSteer();
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      speed = 1 + score / 100; // speeds up as you eat
      scoreEl.textContent = score;
      speedEl.textContent = speed.toFixed(1) + 'x';
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, stepMs());
    } else {
      snake.pop();
    }
    draw();
  }
  function autoSteer() {
    // Greedy safe steering: head toward the food, never reverse, never hit wall/self.
    var head = snake[0];
    var options = [{x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}]
      .filter(function (d) { return !(d.x === -dir.x && d.y === -dir.y); });
    function safe(d) {
      var nx = head.x + d.x, ny = head.y + d.y;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return false;
      return !snake.some(function (s, i) { return i < snake.length - 1 && s.x === nx && s.y === ny; });
    }
    var safeMoves = options.filter(safe);
    if (!safeMoves.length) return;
    safeMoves.sort(function (a, b) {
      var da = Math.abs(head.x + a.x - food.x) + Math.abs(head.y + a.y - food.y);
      var db = Math.abs(head.x + b.x - food.x) + Math.abs(head.y + b.y - food.y);
      return da - db;
    });
    nextDir = safeMoves[0];
  }
  function draw() {
    ctx.fillStyle = '#0a0a24'; ctx.fillRect(0, 0, 480, 480);
    ctx.strokeStyle = 'rgba(57,255,136,0.08)'; ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 480); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(480, i * CELL); ctx.stroke();
    }
    // food
    ctx.fillStyle = '#ffe14d';
    ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(food.x * CELL + 12, food.y * CELL + 12, 9, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // snake
    snake.forEach(function (seg, i) {
      ctx.fillStyle = i === 0 ? '#39ff88' : (i % 2 ? '#00e5ff' : '#2ee6a8');
      ctx.shadowColor = '#39ff88'; ctx.shadowBlur = i === 0 ? 14 : 6;
      var pad = i === 0 ? 1 : 3;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    });
    ctx.shadowBlur = 0;
  }
  function gameOver() {
    alive = false; clearInterval(timer);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('neon-snake-best', String(best)); } catch (e) {}
    }
    finalScoreEl.textContent = score;
    overlay.classList.add('show');
    draw();
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    var map = {arrowup: {x: 0, y: -1}, w: {x: 0, y: -1}, arrowdown: {x: 0, y: 1}, s: {x: 0, y: 1},
               arrowleft: {x: -1, y: 0}, a: {x: -1, y: 0}, arrowright: {x: 1, y: 0}, d: {x: 1, y: 0}};
    if (map[k]) {
      var d = map[k];
      if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
      e.preventDefault();
    } else if (k === 'r') { reset(); }
    else if (k === 'p') { paused = !paused; }
  });
  document.getElementById('restartBtn').addEventListener('click', reset);
  canvas.addEventListener('click', function () { if (!alive) reset(); });
  window.__snake = { reset: reset, state: function () { return {score: score, len: snake.length, alive: alive}; } };
  reset();
  draw();
})();
</script>
</body>
</html>
